<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>家长面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F5FA;font-family:'Noto Sans SC',sans-serif;color:#1E2033;display:flex;flex-direction:column;padding:44px 16px 20px;gap:12px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px">
<a href="Map.dc.html" style="text-decoration:none;font-size:14px;font-weight:700;height:40px;display:flex;align-items:center;color:#2F7DE1">‹ 返回</a>
<h1 style="margin:0 auto 0 4px;font-size:22px;font-weight:900">家长面板</h1>
<span style="font-size:12px;color:#4A4F6A">本周</span>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;background:#E6E8F2;border-radius:14px;padding:4px">
<button onClick="{{pickA}}" style="height:42px;border-radius:10px;border:none;background:{{aBg}};font-family:'Noto Sans SC',sans-serif;font-size:14px;font-weight:700;color:#1E2033">小明 · Lv 6</button>
<button onClick="{{pickB}}" style="height:42px;border-radius:10px;border:none;background:{{bBg}};font-family:'Noto Sans SC',sans-serif;font-size:14px;font-weight:700;color:#1E2033">小慧 · Lv 3</button>
</div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">学习时间</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px">{{c.mins}}<span style="font-size:13px"> 分</span></span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">学习天数</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px">{{c.days}}<span style="font-size:13px"> / 7</span></span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">已掌握</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px">{{c.mastered}}<span style="font-size:13px"> / 80</span></span></div>
</div>
<div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:700">每天学习分钟</span>
<div style="height:96px;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:8px;align-items:end">
<sc-for list="{{c.week}}" as="d" hint-placeholder-count="7">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
<span style="font-family:'Baloo 2',sans-serif;font-weight:600;font-size:11px;color:#4A4F6A">{{d.m}}</span>
<div style="width:100%;height:{{d.h}};border-radius:6px 6px 2px 2px;background:#2F7DE1"></div>
</div>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:8px;font-size:11px;color:#4A4F6A;text-align:center"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
</div>
<div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between"><span style="font-size:14px;font-weight:700">最需要练习的字</span><span style="font-size:12px;color:#4A4F6A">错误率</span></div>
<sc-for list="{{c.weak}}" as="w" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:120px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px">{{w.word}}</span>
<span style="flex-grow:1;font-size:13px;color:#4A4F6A">{{w.zh}}</span>
<div style="width:70px;height:8px;border-radius:4px;background:#F1F2F8;overflow:hidden"><div style="width:{{w.pct}};height:8px;background:#E5533D"></div></div>
<span style="width:34px;text-align:right;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:13px">{{w.pct}}</span>
</div>
</sc-for>
</div>
<div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
<div style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:700">每日游戏时间上限</span><span style="font-size:12px;color:#4A4F6A">到时间后提示休息</span></div>
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px">20 分</span>
<button onClick="{{toggle}}" aria-label="开关游戏时间上限" style="width:52px;height:32px;border-radius:16px;border:none;background:{{tgBg}};display:flex;align-items:center;padding:3px;justify-content:{{tgJust}}"><span style="width:26px;height:26px;border-radius:50%;background:#FFFFFF;display:block"></span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { kid: 'a', limit: true }; }
renderVals() {
const mk = (arr) => { const max = Math.max.apply(null, arr); return arr.map((m) => ({ m, h: Math.max(4, Math.round(m / max * 70)) + 'px' })); };
const data = {
a: { mins: 96, days: 5, mastered: 34, week: mk([18, 22, 0, 15, 20, 21, 0]),
weak: [{ word: 'rajin', zh: '勤劳', pct: '58%' }, { word: 'menyiram', zh: '浇水', pct: '45%' }, { word: 'gotong-royong', zh: '同心协力', pct: '40%' }, { word: 'sampah', zh: '垃圾', pct: '33%' }] },
b: { mins: 52, days: 3, mastered: 14, week: mk([12, 0, 20, 0, 0, 20, 0]),
weak: [{ word: 'bersih', zh: '干净', pct: '50%' }, { word: 'sungai', zh: '河流', pct: '42%' }, { word: 'kebun', zh: '园子', pct: '36%' }, { word: 'pokok', zh: '树', pct: '25%' }] }
};
const k = this.state.kid;
return {
c: data[k],
aBg: k === 'a' ? '#FFFFFF' : 'transparent', bBg: k === 'b' ? '#FFFFFF' : 'transparent',
pickA: () => this.setState({ kid: 'a' }), pickB: () => this.setState({ kid: 'b' }),
tgBg: this.state.limit ? '#1FA39A' : '#C9CCD8', tgJust: this.state.limit ? 'flex-end' : 'flex-start',
toggle: () => this.setState({ limit: !this.state.limit })
};
}
}
</script>
</body>
</html>
