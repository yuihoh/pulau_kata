<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>商店</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFF6E5;font-family:'Noto Sans SC',sans-serif;color:#1E2033;display:flex;flex-direction:column;overflow:hidden">
<div style="background:#C2410C;color:#FFFFFF;padding:44px 16px 16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px">
<a href="Map.dc.html" style="color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:700;height:40px;display:flex;align-items:center">‹ 地图</a>
<h1 style="margin:0 auto 0 8px;font-family:'ZCOOL KuaiLe',sans-serif;font-size:26px;font-weight:400">勇士商店</h1>
<div style="display:flex;align-items:center;gap:5px;background:#9A3412;border-radius:16px;padding:6px 10px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFC23D" stroke="#B7790A" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#B7790A" stroke-width="2"/></svg>1,290</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;background:#9A3412;border-radius:16px;padding:4px">
<button onClick="{{showPotion}}" style="height:44px;border-radius:12px;border:none;background:{{potionBg}};color:{{potionInk}};font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700">药水</button>
<button onClick="{{showLook}}" style="height:44px;border-radius:12px;border:none;background:{{lookBg}};color:{{lookInk}};font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700">外观</button>
</div>
</div>
<div style="padding:16px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="background:#FFFFFF;border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;border:2px solid #F0E3C8;opacity:{{it.op}}">
<div style="width:56px;height:56px;border-radius:14px;background:{{it.soft}};display:flex;align-items:center;justify-content:center">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="{{it.fill}}" stroke="#1E2033" stroke-width="1.6" stroke-linejoin="round"><path d="{{it.icon}}"/></svg>
</div>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:700">{{it.name}}</span>
<span style="font-size:12px;color:#4A4F6A">{{it.desc}}</span>
</div>
<button style="min-width:76px;height:44px;border-radius:22px;border:none;background:{{it.btn}};color:#1E2033;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px">{{it.price}}</button>
</div>
</sc-for>
</div>
<div style="flex-grow:1"></div>
<div style="margin:0 16px 28px;background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:2px dashed #E2D3B5">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
<span style="font-size:13px;color:#4A4F6A">装备只能从关卡宝箱获得，商店不卖装备。商店只收游戏金币，不设真钱购买。</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'potion' }; }
renderVals() {
const flask = 'M9 3h6M10 3v6l-5 9a2 2 0 001.8 3h10.4a2 2 0 001.8-3l-5-9V3';
const shirt = 'M8 4l-5 3 2 4 2-1v10h10V10l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z';
const paw = 'M12 13c-3 0-6 3-6 5.5 0 1.5 1.5 2 3 1.5 1-.3 2-.5 3-.5s2 .2 3 .5c1.5.5 3 0 3-1.5 0-2.5-3-5.5-6-5.5z';
const potions = [
{ name: '提示药水', desc: '本场 +1 次提示（每场限 1 瓶）', price: '30', soft: '#FFF6E5', fill: '#FFC94D', icon: flask },
{ name: '时间药水', desc: '本场每题 +5 秒', price: '30', soft: '#EEF4FF', fill: '#9CC3FF', icon: flask },
{ name: '生命药水', desc: '本场 +1 生命', price: '50', soft: '#FDE7E3', fill: '#F59A8B', icon: flask }
].map((p) => ({ ...p, btn: '#FFB020', op: '1' }));
const looks = [
{ name: '红色披风', desc: '战斗时披风会飘动', price: '120', soft: '#FDE7E3', fill: '#E5533D', icon: shirt, btn: '#FFB020', op: '1' },
{ name: '星空战袍', desc: '紫色战袍，带星星图案', price: '200', soft: '#F3ECFC', fill: '#8B4FD8', icon: shirt, btn: '#FFB020', op: '1' },
{ name: '小龙宠物', desc: 'Lv 10 解锁 · 跟着你冒险', price: 'Lv10', soft: '#E3F3F1', fill: '#6CCB5F', icon: paw, btn: '#E6E8F2', op: '0.6' }
];
const p = this.state.tab === 'potion';
return {
items: p ? potions : looks,
potionBg: p ? '#FFFFFF' : 'transparent', potionInk: p ? '#9A3412' : '#FFFFFF',
lookBg: p ? 'transparent' : '#FFFFFF', lookInk: p ? '#FFFFFF' : '#9A3412',
showPotion: () => this.setState({ tab: 'potion' }), showLook: () => this.setState({ tab: 'look' })
};
}
}
</script>
</body>
</html>
