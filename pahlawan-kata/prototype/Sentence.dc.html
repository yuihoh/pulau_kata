<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>造句 · 词块排序</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#2E2552;font-family:'Noto Sans SC',sans-serif;color:#FFFFFF;display:flex;flex-direction:column;overflow:hidden">
<div style="padding:44px 16px 0;display:flex;align-items:center;gap:10px">
<span style="font-size:14px;font-weight:700;background:#4A3D80;border-radius:12px;padding:6px 10px">关卡 3 · 造句</span>
<div style="flex-grow:1"></div>
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px">第 2 / 5 句</span>
</div>
<div style="height:200px;display:flex;align-items:center;justify-content:center;gap:16px">
<svg width="120" height="150" viewBox="0 0 120 150" role="img" aria-label="句子守卫：拿盾的石像">
<ellipse cx="60" cy="144" rx="44" ry="6" fill="#000000" opacity="0.3"/>
<rect x="22" y="40" width="76" height="100" rx="18" fill="#8E86B8"/>
<rect x="34" y="58" width="16" height="10" rx="3" fill="#FFC94D"/><rect x="70" y="58" width="16" height="10" rx="3" fill="#FFC94D"/>
<rect x="44" y="84" width="32" height="6" rx="3" fill="#4A3D80"/>
<path d="M30 40 L60 14 L90 40 Z" fill="#6E66A0"/>
</svg>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:14px;font-weight:700">句子守卫</span>
<div style="display:flex;gap:4px">
<div style="width:26px;height:14px;border-radius:4px;background:#4A3D80"></div>
<div style="width:26px;height:14px;border-radius:4px;background:#FFC94D"></div>
<div style="width:26px;height:14px;border-radius:4px;background:#FFC94D"></div>
<div style="width:26px;height:14px;border-radius:4px;background:#FFC94D"></div>
<div style="width:26px;height:14px;border-radius:4px;background:#FFC94D"></div>
</div>
<span style="font-size:12px;color:#D3CDF0">每完成一句，击破一块盾</span>
</div>
</div>
<div style="flex-grow:1;background:#FFFFFF;border-radius:28px 28px 0 0;color:#1E2033;padding:22px 16px 24px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column;gap:4px">
<span style="font-size:12px;font-weight:700;color:#4A4F6A">点词块，排成正确的句子</span>
<span style="font-size:20px;font-weight:900">Ali 在园子里给树浇水。</span>
</div>
<div style="min-height:120px;border-radius:18px;border:3px dashed {{slotBorder}};background:{{slotBg}};padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px">
<sc-for list="{{placed}}" as="t" hint-placeholder-count="2">
<button onClick="{{t.pick}}" style="height:48px;padding:0 16px;border-radius:12px;border:2px solid #2F7DE1;background:#EEF4FF;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#1E2033">{{t.w}}</button>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;color:#6B7088;padding:12px 4px">句子放在这里…</span></sc-if>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">
<sc-for list="{{bank}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" style="height:52px;padding:0 18px;border-radius:12px;border:2px solid #C9CCD8;background:#FFFFFF;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#1E2033;box-shadow:0 4px 0 #C9CCD8">{{t.w}}</button>
</sc-for>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;justify-content:space-between;background:{{msgBg}};border-radius:14px;padding:10px 14px">
<span style="font-size:14px;font-weight:700">{{msg}}</span>
</div>
</sc-if>
<div style="flex-grow:1"></div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<button onClick="{{reset}}" style="height:52px;border-radius:26px;border:2px solid #1E2033;background:transparent;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700;color:#1E2033">重来</button>
<a href="Boss.dc.html" style="height:52px;border-radius:26px;background:#FFB020;color:#1E2033;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;box-shadow:0 4px 0 #B7790A">检查 ›</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { placed: [0, 4] }; }
renderVals() {
const tiles = ['Ali', 'pokok', 'di', 'kebun.', 'menyiram'];
const target = 'Ali menyiram pokok di kebun.';
const placedIdx = this.state.placed;
const placed = placedIdx.map((i) => ({ w: tiles[i], pick: () => this.setState({ placed: placedIdx.filter((x) => x !== i) }) }));
const bank = tiles.map((w, i) => ({ w, i })).filter((t) => placedIdx.indexOf(t.i) < 0)
.map((t) => ({ w: t.w, pick: () => this.setState({ placed: placedIdx.concat([t.i]) }) }));
const done = placedIdx.length === tiles.length;
const ok = done && placed.map((t) => t.w).join(' ') === target;
return {
placed, bank, empty: placedIdx.length === 0, done,
msg: ok ? '完美！守卫的盾被击破了' : '顺序不太对，点词块拿回来再试',
msgBg: ok ? '#E3F3F1' : '#FDE7E3',
slotBorder: ok ? '#1FA39A' : '#B5BAD3', slotBg: ok ? '#E3F3F1' : '#F7F8FC',
reset: () => this.setState({ placed: [] })
};
}
}
</script>
</body>
</html>
