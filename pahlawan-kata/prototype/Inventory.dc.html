<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>装备背包</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFF6E5;font-family:'Noto Sans SC',sans-serif;color:#1E2033;display:flex;flex-direction:column;overflow:hidden">
<div style="background:#232A5C;color:#FFFFFF;padding:44px 16px 12px;display:flex;align-items:center;gap:10px">
<a href="Map.dc.html" style="color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:700;height:40px;display:flex;align-items:center">‹ 地图</a>
<h1 style="margin:0 auto 0 8px;font-family:'ZCOOL KuaiLe',sans-serif;font-size:26px;font-weight:400">我的装备</h1>
<a href="Wardrobe.dc.html" style="font-size:13px;font-weight:700;background:#FFB020;color:#1E2033;text-decoration:none;border-radius:12px;padding:0 12px;height:36px;display:flex;align-items:center">换装 · 衣柜</a>
</div>
<div style="background:#232A5C;padding:4px 16px 18px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{left}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.pick}}" aria-label="{{s.slot}}" style="width:64px;height:64px;border-radius:16px;background:#FFFFFF;border:4px solid {{s.color}};box-shadow:0 0 0 3px {{s.ring}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:'Noto Sans SC',sans-serif;color:#1E2033"><span style="font-size:22px;font-weight:900;line-height:1.1">{{s.glyph}}</span><span style="font-size:10px;font-weight:700;color:#4A4F6A">{{s.slot}}</span></button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<svg width="140" height="186" viewBox="0 0 120 160" role="img" aria-label="装备齐全的勇士">
<ellipse cx="60" cy="152" rx="34" ry="6" fill="#000000" opacity="0.3"/>
<rect x="45" y="116" width="12" height="30" rx="5" fill="#3A3F66"/><rect x="63" y="116" width="12" height="30" rx="5" fill="#3A3F66"/>
<rect x="40" y="136" width="20" height="12" rx="4" fill="#1FA39A"/><rect x="60" y="136" width="20" height="12" rx="4" fill="#1FA39A"/>
<rect x="34" y="76" width="52" height="48" rx="16" fill="#8A93A6"/>
<rect x="44" y="84" width="32" height="26" rx="8" fill="#C9D3E3"/>
<rect x="12" y="78" width="28" height="38" rx="10" fill="#C9D3E3" stroke="#8A93A6" stroke-width="3"/>
<circle cx="26" cy="97" r="6" fill="#E5533D"/>
<circle cx="60" cy="50" r="28" fill="#FFD9B8"/>
<path d="M30 46 C30 18 46 12 60 12 C74 12 90 18 90 46 L84 40 C78 30 42 30 36 40 Z" fill="#2F7DE1"/>
<rect x="56" y="6" width="8" height="12" rx="3" fill="#FFC94D"/>
<circle cx="50" cy="54" r="3.5" fill="#1E2033"/><circle cx="70" cy="54" r="3.5" fill="#1E2033"/>
<path d="M53 64 Q60 69 67 64" fill="none" stroke="#1E2033" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="60" cy="80" r="5" fill="#FFC94D"/>
<rect x="86" y="96" width="14" height="14" rx="5" fill="#9CC3FF"/>
<rect x="96" y="38" width="7" height="66" rx="2" fill="#E6EBF2" stroke="#8B4FD8" stroke-width="2"/><rect x="88" y="100" width="23" height="7" rx="2" fill="#8B4FD8"/>
</svg>
<sc-for list="{{bottom}}" as="s" hint-placeholder-count="1">
<button onClick="{{s.pick}}" aria-label="{{s.slot}}" style="width:64px;height:64px;border-radius:16px;background:#FFFFFF;border:4px solid {{s.color}};box-shadow:0 0 0 3px {{s.ring}};display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif;color:#1E2033"><span style="font-size:22px;font-weight:900;line-height:1.1">{{s.glyph}}</span><span style="font-size:10px;font-weight:700;color:#4A4F6A">{{s.slot}}</span></button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{right}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.pick}}" aria-label="{{s.slot}}" style="width:64px;height:64px;border-radius:16px;background:#FFFFFF;border:4px solid {{s.color}};box-shadow:0 0 0 3px {{s.ring}};display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif;color:#1E2033"><span style="font-size:22px;font-weight:900;line-height:1.1">{{s.glyph}}</span><span style="font-size:10px;font-weight:700;color:#4A4F6A">{{s.slot}}</span></button>
</sc-for>
</div>
</div>
<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
<div style="background:#FFFFFF;border-radius:18px;padding:12px 14px;border:3px solid {{sel.color}};display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;font-weight:900">{{sel.name}}</span><span style="font-size:11px;font-weight:700;color:#FFFFFF;background:{{sel.tag}};border-radius:8px;padding:2px 8px">{{sel.rarity}}</span></div>
<span style="font-size:14px;color:#1E2033">{{sel.effect}}</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">生命</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#B4321F">4</span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">每题时间</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#1F5FB0">20s</span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">提示</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#8A5A00">2</span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">时间暂停</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#1F5FB0">2</span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">护盾</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#0F766E">1</span></div>
<div style="background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A4F6A">复活</span><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#6A35B0">1</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700"><span>背包 · 9 件</span><span style="font-size:12px;color:#4A4F6A">重复装备可分解成金币</span></div>
<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:6px">
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px solid #8A8F98;display:flex;align-items:center;justify-content:center;font-weight:900">套</div>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px solid #8A8F98;display:flex;align-items:center;justify-content:center;font-weight:900">盔</div>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px solid #2F7DE1;display:flex;align-items:center;justify-content:center;font-weight:900">盾</div>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px solid #8A8F98;display:flex;align-items:center;justify-content:center;font-weight:900">剑</div>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px solid #8A8F98;display:flex;align-items:center;justify-content:center;font-weight:900">靴</div>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:3px dashed #C9CCD8"></div>
</div>
<div style="display:flex;gap:12px;font-size:11px;color:#4A4F6A"><span><b style="color:#6B7088">■</b> 普通</span><span><b style="color:#2F7DE1">■</b> 稀有</span><span><b style="color:#8B4FD8">■</b> 史诗</span><span><b style="color:#B7790A">■</b> 传说</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 4 }; }
renderVals() {
const R = { '普通': ['#8A8F98', '#6B7088'], '稀有': ['#2F7DE1', '#1F5FB0'], '史诗': ['#8B4FD8', '#6A35B0'], '传说': ['#E0A200', '#8A5A00'] };
const items = [
{ slot: '头盔', glyph: '盔', name: '智慧头盔', rarity: '稀有', effect: '每场 +2 次提示' },
{ slot: '铠甲', glyph: '甲', name: '勇气铠甲', rarity: '普通', effect: '+1 生命' },
{ slot: '盾牌', glyph: '盾', name: '守护盾', rarity: '普通', effect: '每场抵挡 1 次答错（不掉血）' },
{ slot: '武器', glyph: '剑', name: '词语之剑', rarity: '史诗', effect: '连续答对 3 题起，金币与经验 +50%' },
{ slot: '手套', glyph: '手', name: '时光手套', rarity: '稀有', effect: '每场 2 次时间暂停（冻结 10 秒）' },
{ slot: '靴子', glyph: '靴', name: '疾风靴', rarity: '普通', effect: '每题基础时间 +2 秒' },
{ slot: '护身符', glyph: '符', name: '复活护符', rarity: '普通', effect: '每场 1 次复活（生命归零时回复 1 颗）' }
];
const sel = this.state.sel;
const view = items.map((it, i) => ({ ...it, color: R[it.rarity][0], tag: R[it.rarity][1], ring: i === sel ? '#FFC94D' : 'transparent', pick: () => this.setState({ sel: i }) }));
return { left: [view[0], view[1], view[2]], right: [view[3], view[4], view[5]], bottom: [view[6]], sel: view[sel] };
}
}
</script>
</body>
</html>
