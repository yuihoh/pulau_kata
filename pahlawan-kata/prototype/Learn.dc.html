<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>认字 · 翻卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E3F3F1;font-family:'Noto Sans SC',sans-serif;color:#1E2033;display:flex;flex-direction:column;padding:44px 20px 28px;gap:16px;overflow:hidden">
<div style="display:flex;align-items:center;gap:12px">
<a href="Kingdom.dc.html" aria-label="离开" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#1E2033" stroke-width="2.4" stroke-linecap="round"/></svg></a>
<div style="flex-grow:1;height:12px;border-radius:6px;background:#FFFFFF;overflow:hidden"><div style="width:40%;height:12px;background:#1FA39A"></div></div>
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px">4 / 10</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:14px;font-weight:700;color:#0F766E">关卡 1 · 认字</span>
<span style="font-size:12px;color:#4A4F6A">点卡片翻面</span>
</div>
<button onClick="{{flip}}" aria-label="翻转卡片" style="flex-grow:1;border:none;border-radius:28px;background:#FFFFFF;box-shadow:0 6px 0 #9FD3CC;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;font-family:'Noto Sans SC',sans-serif;color:#1E2033;cursor:pointer">
<sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="一棵树">
<rect x="0" y="0" width="200" height="200" rx="24" fill="#F3FAF9"/>
<rect x="88" y="110" width="24" height="64" rx="6" fill="#8B5A2B"/>
<circle cx="100" cy="82" r="46" fill="#4E9A3E"/>
<circle cx="66" cy="102" r="30" fill="#5DB04A"/>
<circle cx="134" cy="102" r="30" fill="#5DB04A"/>
<rect x="30" y="172" width="140" height="8" rx="4" fill="#9FD3CC"/>
</svg>
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:1">pokok</span>
<span style="display:flex;align-items:center;gap:8px;background:#232A5C;color:#FFFFFF;border-radius:24px;padding:10px 18px;font-size:15px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>听发音</span>
</div>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;text-align:center">
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#0F766E">pokok</span>
<span style="font-size:34px;font-weight:900">树</span>
<span style="font-size:15px;color:#4A4F6A">English: tree</span>
<div style="width:100%;background:#FFF6E5;border-radius:18px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;text-align:left">
<span style="font-size:12px;font-weight:700;color:#8A5A00">例句</span>
<span style="font-family:'Baloo 2',sans-serif;font-weight:600;font-size:20px">Ali menyiram <span style="background:#FFC94D;border-radius:6px;padding:0 4px">pokok</span> di kebun.</span>
<span style="font-size:14px;color:#4A4F6A">Ali 在园子里给树浇水。</span>
</div>
</div>
</sc-if>
</button>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<button style="height:52px;border-radius:26px;border:2px solid #1E2033;background:transparent;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700;color:#1E2033">‹ 上一张</button>
<a href="Quiz.dc.html" style="height:52px;border-radius:26px;background:#1FA39A;color:#FFFFFF;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-shadow:0 4px 0 #0F766E">下一张 ›</a>
</div>
<span style="font-size:12px;color:#4A4F6A;text-align:center">每 4 张卡后有一次小检查 · 答错的卡会再出现</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { flipped: false }; }
renderVals() {
const f = this.state.flipped;
return { front: !f, back: f, flip: () => this.setState({ flipped: !f }) };
}
}
</script>
</body>
</html>
