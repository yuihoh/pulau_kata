<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>秘境 Seni Bahasa · 谚语配对</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7DE1}a:hover{color:#1F5FB0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#3B2470;font-family:'Noto Sans SC',sans-serif;color:#FFFFFF;display:flex;flex-direction:column;padding:40px 16px 24px;gap:12px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px">
<a href="Kingdom.dc.html" aria-label="离开" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></svg></a>
<div style="display:flex;flex-direction:column">
<span style="font-size:12px;font-weight:700;color:#D9C8F7">秘境 · Tema 3 Unit 9 示例</span>
<h1 style="margin:0;font-family:'ZCOOL KuaiLe',sans-serif;font-size:26px;font-weight:400">谚语石碑</h1>
</div>
<span style="margin-left:auto;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;background:#5A3A9E;border-radius:12px;padding:4px 12px">{{count}} / 4</span>
</div>
<div style="background:#5A3A9E;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.5">先点左边的谚语，再点右边的意思。全部配对成功，石碑就会打开。</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{left}}" as="l" hint-placeholder-count="4">
<button onClick="{{l.pick}}" style="min-height:86px;border-radius:16px;border:3px solid {{l.border}};background:{{l.bg}};color:{{l.ink}};padding:8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left;font-family:'Noto Sans SC',sans-serif">
<span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;line-height:1.2">{{l.bm}}</span>
<span style="font-size:11px;font-weight:700;color:{{l.tagInk}}">{{l.kind}}</span>
</button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{right}}" as="r" hint-placeholder-count="4">
<button onClick="{{r.pick}}" style="min-height:86px;border-radius:16px;border:3px solid {{r.border}};background:{{r.bg}};color:{{r.ink}};padding:8px 10px;display:flex;align-items:center;text-align:left;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700;line-height:1.4">{{r.zh}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{msgOn}}" hint-placeholder-val="{{ false }}">
<div style="background:{{msgBg}};color:#1E2033;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700">{{msg}}</div>
</sc-if>
<div style="flex-grow:1"></div>
<div style="background:#FFFFFF;color:#1E2033;border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px">
<div style="width:52px;height:52px;border-radius:14px;background:#FFF1C9;display:flex;align-items:center;justify-content:center">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l2 18-7-3-7 3z" fill="#FFB020" stroke="#B7790A" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 9h8M8 13h8" stroke="#FFFFFF" stroke-width="2"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:2px;flex-grow:1">
<span style="font-size:12px;color:#4A4F6A">全部配对奖励 · 外观</span>
<span style="font-size:15px;font-weight:900">反光安全披风</span>
<span style="font-size:12px;color:#6A35B0;font-weight:700">消防英雄套装 1 / 4</span>
</div>
<a href="Wardrobe.dc.html" style="font-size:13px;font-weight:700;color:#6A35B0;height:44px;display:flex;align-items:center">去衣柜 ›</a>
</div>
<span style="font-size:11px;color:#D9C8F7;text-align:center">其他秘境玩法：改编诗歌填空 · 爪夷文认读（Unit 8 / 16 / 24）</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: null, done: [0], wrong: null }; }
renderVals() {
const P = [
{ bm: 'malang tidak berbau', kind: 'peribahasa', zh: '灾祸来时，没有预兆' },
{ bm: 'biar lambat asalkan selamat', kind: 'peribahasa', zh: '宁可慢一点，也要安全' },
{ bm: 'lepas tangan', kind: 'simpulan bahasa', zh: '不负责任，撒手不管' },
{ bm: 'ambil berat', kind: 'simpulan bahasa', zh: '关心，在意' }
];
const order = [2, 0, 3, 1];
const s = this.state;
const isDone = (i) => s.done.indexOf(i) >= 0;
const left = P.map((x, i) => {
const d = isDone(i), on = s.sel === i;
return { ...x, border: d ? '#1FA39A' : (on ? '#FFC94D' : '#7A5BC0'), bg: d ? '#E3F3F1' : (on ? '#FFF6E5' : '#4C2F8A'), ink: d || on ? '#1E2033' : '#FFFFFF', tagInk: d || on ? '#6A35B0' : '#D9C8F7',
pick: () => { if (!isDone(i)) this.setState({ sel: i, wrong: null }); } };
});
const right = order.map((i) => {
const d = isDone(i), bad = s.wrong === i;
return { zh: P[i].zh, border: d ? '#1FA39A' : (bad ? '#E5533D' : '#7A5BC0'), bg: d ? '#E3F3F1' : (bad ? '#FDE7E3' : '#4C2F8A'), ink: d || bad ? '#1E2033' : '#FFFFFF',
pick: () => {
const st = this.state;
if (st.sel === null || isDone(i)) return;
if (st.sel === i) this.setState({ done: st.done.concat([i]), sel: null, wrong: null });
else this.setState({ wrong: i });
} };
});
const count = s.done.length;
const all = count === 4;
return {
left, right, count,
msgOn: all || s.wrong !== null,
msg: all ? '石碑打开了！获得「反光安全披风」' : '不太对，再想想这个谚语的意思',
msgBg: all ? '#E3F3F1' : '#FDE7E3'
};
}
}
</script>
</body>
</html>
